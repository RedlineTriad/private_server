name: Ansible

on:
  pull_request:

permissions:
  contents: read

jobs:
  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: redlinetriad/molecule-vagrant-qemu-action@v1
        with:
          molecule_working_dir: software
        